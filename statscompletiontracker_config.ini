; Stats & Completion Tracker 1.0 settings. Enabled is read when the game starts; the rest applies while it runs.
; With Mod Settings Menu installed, the main switches are also under Options > MODS, and a choice
; made there wins over this file.

[General]
; 1 = the mod is on: four more tabs in the Archives screen (Completion, Story, Zones, Dylan). 0 = off.
Enabled=1

[Archives]
; 1 = while one of the mod's tabs is open, the game's own list underneath is switched off, so the D-pad
; does not walk it unseen. Set 0 if the game's Archives lists stop reacting after you used the tabs.
HoldGameList=1
; 1 = the tabs write what they do into statscompletiontracker.log (tab changes, key presses). For finding faults.
Trace=0

[Page]
; Names of the main story missions, side stories and enemy research entries you have not done yet.
; 0 = shown once the main story is finished. 1 = always shown. 2 = never shown.
; Artifacts, clothes and abilities follow HideLockedNames below.
MissingNames=0
; 1 = Main Story Missions and Side Stories show ?? as their total until all of them are done ("25 / ??").
; 0 = the total is always shown.
HideStoryTotals=1
; Zones you have not visited yet, in the lists by zone and in notes such as "... zone level 11".
; One SHUM machine counts as not visited until the main story is finished or you have a score on it.
; 0 = named. 1 = shown as ???. 2 = left out of the lists.
UnvisitedZones=1
; 1 = Artifacts and clothes you have not unlocked show as ??? in the lists of missing ones; where they
; come from stays. A missing ability shows as ??? until its Resonant is defeated.
; 0 = everything is named.
HideLockedNames=1
; 1 = a missing Artifact, clothing piece or ability says where it comes from, such as a zone level, a vendor
; or a side story. 0 = these unlock hints read ???.
UnlockHints=1

[Saves]
; Leave empty: the mod reads your saves the way the game does, through Steam.
; If the page says it found no save, put the folder with the slot-... files here, for example
; Folder=C:\Program Files (x86)\Steam\userdata\12345678\3669870\remote
Folder=
